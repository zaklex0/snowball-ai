<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макет задач — Snowball.ai</title>
<!-- A mockup only: the next version of the «Задачи» section inside the 1.9.0 window (tabs on top, icon sidebar,
     upcoming events, the star button). Board and list views, the tasks assistant bar (cheapest model, tasks only),
     custom columns, the task panel on the right, subtasks, delete with undo, what counts in statistics.
     Numbered marks on the page match the explanations on the right. Not loaded by the app. -->
<link rel="stylesheet" href="../src/fonts.css">
<style>
  /* The program's colours (copied from src/styles.css, so the mockup also opens on its own) */
  :root {
    --bg: #FCEEE4; --titlebar: #F9E3D4; --surface: #FFF9F4; --surface-2: #FBE9DD; --line: #F0D7C7;
    --ink: #4B3128; --ink-soft: #8A695B; --accent: #F4AA84; --accent-hover: #EF9B72; --accent-ink: #3F251C; --accent-strong: #BF603D;
    --danger: #B5463B; --ok-bg: #DCEBD1; --ok-ink: #3B5934; --toast-bg: #4B3128; --toast-ink: #FFF4EC;
    --shadow: 0 1px 0 rgba(120, 72, 52, .05), 0 22px 44px -28px rgba(150, 85, 55, .38);
    --pop-shadow: 0 12px 32px -10px rgba(110, 60, 40, .35);
    --cat-static-dot: #4F9A40; --cat-video-dot: #3C78C8; --cat-video-ink: #22487A; --cat-system-dot: #D0493E; --cat-system-ink: #7A2620;
    --font-display: "Unbounded", "Golos Text", "Segoe UI", system-ui, sans-serif;
    --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #251B17; --titlebar: #2C201B; --surface: #30241E; --surface-2: #3A2C25; --line: #4A372E;
      --ink: #F5E6DC; --ink-soft: #C3A596; --accent: #F2A982; --accent-hover: #F6B994; --accent-ink: #2B1C16; --accent-strong: #E08A62;
      --danger: #F0907F; --ok-bg: #2F4430; --ok-ink: #CFE6C4; --toast-bg: #F5E6DC; --toast-ink: #2B1C16;
      --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 22px 44px -28px rgba(0, 0, 0, .7); --pop-shadow: 0 14px 34px -10px rgba(0, 0, 0, .7);
      --cat-static-dot: #8CCB7C; --cat-video-dot: #86B4F0; --cat-video-ink: #CFE0F6; --cat-system-dot: #F08A80; --cat-system-ink: #F7CBC6;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  svg { width: 16px; height: 16px; flex: none; }
  @keyframes ev-now { 50% { background: color-mix(in srgb, var(--c) 30%, transparent); } }
  @keyframes rec { 50% { opacity: .5; } }

  .pg { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; padding: 18px; min-height: 100vh; align-items: start; }
  @media (max-width: 1250px) { .pg { grid-template-columns: minmax(0, 1fr); } }

  /* ---- the program window, as in 1.9.0 ---- */
  .win { position: relative; display: flex; height: calc(100vh - 36px); min-height: 680px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow); }

  .side { flex: none; width: 236px; display: flex; flex-direction: column; gap: 16px; padding: 0 10px 12px; background: var(--titlebar); border-right: 1px solid var(--line); }
  .side-head { flex: none; height: 40px; margin: 0 -10px; padding: 0 16px; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
  .side-head i { width: 18px; height: 18px; border-radius: 6px; background: var(--accent); }
  .side-top { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
  .side-icons { display: flex; gap: 2px; justify-content: space-between; margin: 4px 0 16px; }
  .nav-icon { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 10px; background: none; color: var(--ink-soft); }
  .nav-icon:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--ink); }
  .nav-icon.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .nav-icon svg { width: 19px; height: 19px; }
  .nav-badge { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--accent-strong); color: #fff;
    font-size: 10.5px; font-weight: 600; line-height: 16px; text-align: center; box-shadow: 0 0 0 2px var(--titlebar); }
  .side-h { margin: 4px 11px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .up-day { margin: 8px 11px 2px; font-size: 12px; color: var(--ink-soft); }
  .up-ev { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border: 0; border-radius: 9px; background: none; text-align: left; font-size: 13.5px; }
  .up-ev:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .up-ev i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
  .up-ev .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up-ev .tm { font-size: 12px; color: var(--ink-soft); }
  .up-ev.now { background: color-mix(in srgb, var(--c) 16%, transparent); animation: ev-now 2.4s ease-in-out infinite; }
  .up-ev.now .tm { color: var(--ink); font-weight: 600; }
  .side-bottom { display: grid; gap: 8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 11px; border: 0; border-radius: 11px; background: none; color: var(--ink-soft); font-size: 14px; font-weight: 500; text-align: left; }
  .nav-item:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--ink); }
  .nav-item svg { width: 19px; height: 19px; }
  .profile-row { display: flex; gap: 8px; }
  .profile-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); text-align: left; }
  .avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; }
  .profile-name { flex: 1; font-size: 14px; font-weight: 600; }
  .qa-btn { flex: none; width: 46px; display: grid; place-items: center; border: 0; border-radius: 13px; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .qa-btn svg { width: 21px; height: 21px; }

  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .titlebar { flex: none; height: 40px; display: flex; align-items: flex-end; gap: 2px; padding: 0 0 0 8px; background: var(--titlebar); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
  .tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; overflow: hidden; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; width: 190px; flex: 0 1 190px; min-width: 0; padding: 0 6px 0 12px; margin-bottom: -1px;
    border: 1px solid transparent; border-bottom: 0; border-radius: 10px 10px 0 0; background: none; color: var(--ink-soft); text-align: left; font-weight: 500; }
  .tab:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); color: var(--ink); }
  .tab.on { background: var(--bg); color: var(--ink); border-color: var(--line); z-index: 1; }
  .tab .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .x { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; opacity: 0; }
  .tab:hover .x, .tab.on .x { opacity: 1; }
  .tab .x svg { width: 11px; height: 11px; }
  .tab-plus { align-self: center; display: grid; place-items: center; width: 30px; height: 30px; margin-left: 4px; border: 0; border-radius: 9px; background: none; color: var(--ink-soft); }
  .tab-plus svg { width: 17px; height: 17px; }
  .wbtn { margin-left: auto; align-self: stretch; display: flex; }
  .wbtn span { width: 46px; display: grid; place-items: center; font-size: 12px; color: var(--ink-soft); }

  .mn { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .scroller { flex: 1; min-height: 0; overflow: auto; }
  .page { max-width: 1160px; margin: 0 auto; padding: 30px 28px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }

  /* header */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
  .top-text { display: grid; gap: 8px; min-width: 0; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { margin: 0; display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 500; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; }
  .meta { margin: 0; color: var(--ink-soft); font-size: 14px; }
  .alpha { display: inline-flex; align-items: center; font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; line-height: 1.5; padding: 2px 9px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .seg { position: relative; display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg button { padding: 6px 13px; border: 0; border-radius: 9px; background: none; color: var(--ink-soft); font-size: 13.5px; font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stat-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 13.5px; color: var(--ink-soft); }
  .stat-btn b { color: var(--ink); }
  .stat-btn.bump b { animation: bump .5s; }
  @keyframes bump { 40% { color: var(--accent-strong); transform: scale(1.35); } }
  .stat-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 340px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--pop-shadow); font-size: 13px; text-align: left; color: var(--ink); cursor: default; }
  .stat-pop h4 { margin: 0 0 6px; font-size: 13px; }
  .stat-pop ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; max-height: 240px; overflow: auto; }
  .stat-pop li { display: flex; gap: 8px; }
  .stat-pop li em { font-style: normal; font-weight: 600; color: var(--ok-ink); min-width: 22px; }
  .stat-pop li.no { color: var(--ink-soft); }
  .stat-pop li.no em { color: var(--ink-soft); }
  .stat-pop p { margin: 8px 0 0; color: var(--ink-soft); font-size: 12.5px; }

  /* the tasks assistant bar */
  .ab-wrap { display: grid; gap: 8px; }
  .ab { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
  .ab:focus-within { border-color: var(--accent); }
  .ab-ico { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 30%, var(--surface)); color: var(--accent-strong); }
  .ab input { flex: 1; min-width: 0; padding: 8px 0; border: 0; outline: none; background: none; font-size: 15px; }
  .ab input::placeholder { color: var(--ink-soft); opacity: .85; }
  .ab-model { flex: none; font-size: 12px; color: var(--ink-soft); padding: 3px 9px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
  .ab-send { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); }
  .ab-send:disabled { opacity: .45; cursor: default; }
  .ab-send svg { width: 18px; height: 18px; }
  .ab-reply { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: start; gap: 10px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); font-size: 14px; }
  .ab-reply.thinking p { animation: rec 1s infinite; color: var(--ink-soft); }
  .ab-reply > span { display: grid; place-items: center; width: 22px; height: 22px; color: var(--accent-strong); }
  .ab-reply p { margin: 0; line-height: 1.45; }
  .ab-reply .acts { display: flex; gap: 6px; }
  .ab-reply .acts button { position: relative; padding: 3px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
  .ab-reply .acts button.x { padding: 3px 6px; border-color: transparent; background: none; color: var(--ink-soft); }
  .ab-reply .acts button.x svg { width: 12px; height: 12px; }
  .ab-hints { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .ab-hints button { padding: 3px 10px; border: 1px dashed var(--line); border-radius: 999px; background: none; color: var(--ink-soft); font-size: 12.5px; }
  .ab-hints button:hover { border-style: solid; border-color: var(--accent); color: var(--ink); }

  /* filters */
  .flt { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .srch { display: flex; align-items: center; gap: 7px; padding: 0 10px; height: 34px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink-soft); }
  .srch input { width: 170px; border: 0; outline: none; background: none; font-size: 13.5px; color: var(--ink); }
  .fchip { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink-soft); font-size: 13.5px; }
  .fchip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--ink); }
  .fsel { height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink); font-size: 13.5px; }

  /* chips on tasks */
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-soft); white-space: nowrap; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ink-soft)); }
  .chip svg { width: 12px; height: 12px; }
  .p2 { background: color-mix(in srgb, var(--cat-system-dot) 20%, var(--surface)); color: var(--cat-system-ink); }
  .p1 { background: color-mix(in srgb, #D9982A 22%, var(--surface)); color: var(--ink); }
  .due-late { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); color: var(--danger); font-weight: 600; }
  .due-today { background: color-mix(in srgb, var(--accent) 26%, var(--surface)); color: var(--ink); }
  .bar { width: 34px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar b { display: block; height: 100%; background: var(--cat-static-dot); }

  /* board */
  .bd { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding: 10px 2px 6px; }
  .col { position: relative; flex: 0 0 280px; display: grid; gap: 8px; align-content: start; min-height: 200px; padding: 10px; border-radius: 18px;
    background: color-mix(in srgb, var(--c) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 20%, var(--line)); }
  .col.drop { outline: 2px dashed var(--c); outline-offset: -5px; }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 2px 2px 4px 4px; }
  .col-name { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; padding: 3px 11px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); }
  .col-name i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .col-n { font-size: 13px; color: var(--ink-soft); }
  .col-lock { margin-left: auto; color: var(--ink-soft); opacity: .6; display: grid; }
  .col-lock svg { width: 14px; height: 14px; }
  .col-menu { margin-left: auto; position: relative; }
  .col-menu > button { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--ink-soft); }
  .col-menu > button:hover { background: var(--surface); color: var(--ink); }
  .menu-pop { position: absolute; right: 0; top: 32px; z-index: 15; width: 200px; padding: 5px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--pop-shadow); }
  .menu-pop button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; text-align: left; }
  .menu-pop button:hover { background: var(--surface-2); }
  .menu-pop button.danger { color: var(--danger); }
  .col-in { width: 100%; padding: 6px 10px; border: 1px solid var(--c); border-radius: 10px; background: var(--surface); font-size: 13.5px; font-weight: 600; outline: none; }
  .add-col { flex: 0 0 200px; position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 64px; border: 1.5px dashed var(--line); border-radius: 18px; background: none; color: var(--ink-soft); font-size: 14px; font-weight: 500; }
  .add-col:hover { border-color: var(--accent); color: var(--ink); }
  .card { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px 10px; padding: 11px 12px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(120, 72, 52, .06); cursor: pointer; font-size: 14px; }
  .card:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
  .card.sel { border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent); }
  .card.dragging { opacity: .4; }
  .card.fresh { animation: fresh 1.4s ease-out; }
  @keyframes fresh { 0%, 40% { background: color-mix(in srgb, var(--accent) 28%, var(--surface)); } }
  .card .ttl { overflow-wrap: anywhere; line-height: 1.4; }
  .card .row { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .is-done .ttl { color: var(--ink-soft); text-decoration: line-through; }
  .chk { position: relative; display: grid; place-items: center; width: 20px; height: 20px; margin-top: 1px; padding: 0; border: 1.8px solid color-mix(in srgb, var(--c, var(--ink-soft)) 70%, var(--ink-soft)); border-radius: 50%; background: var(--surface); color: transparent; }
  .chk:hover { background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); color: var(--ink-soft); }
  .chk svg { width: 12px; height: 12px; }
  .chk.on { background: var(--cat-static-dot); border-color: var(--cat-static-dot); color: #fff; }
  .add-t { position: relative; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border: 0; border-radius: 10px; background: none; color: var(--ink-soft); font-size: 13.5px; text-align: left; }
  .add-t:hover { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--ink); }
  .add-in { width: 100%; padding: 10px 12px; border: 1px solid var(--c); border-radius: 12px; background: var(--surface); font-size: 14px; outline: none; }
  .empty { padding: 10px; font-size: 13px; color: var(--ink-soft); text-align: center; }

  /* list view */
  .ls { position: relative; display: grid; gap: 16px; padding-top: 6px; }
  .grp { display: grid; gap: 4px; }
  .grp-h { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; padding: 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .grp-h.late { color: var(--danger); }
  .grp-h button { border: 0; background: none; color: inherit; font: inherit; padding: 0; display: inline-flex; align-items: center; gap: 6px; }
  .grp-h span { font-weight: 500; }
  .li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .li:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .li.sel { border-color: var(--accent); }
  .li .mid { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
  .li .ttl { overflow-wrap: anywhere; }
  .li .rt { display: flex; align-items: center; gap: 8px; }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

  /* task panel on the right */
  .pn { position: absolute; top: 0; right: 0; bottom: 0; z-index: 12; width: 400px; max-width: 100%; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: -18px 0 40px -24px rgba(90, 50, 30, .45); transform: translateX(105%); transition: transform .22s ease; }
  .pn.open { transform: none; }
  .pn-h { position: relative; display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 18px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }

      how: "Нажмите «+ Столбец», напишите, например, «На проверке», Enter. У своего столбца есть меню «⋯»: переименовать, сдвинуть, удалить. При удалении его задачи переезжают в «Предстоит», а внизу появляется «Отменить». Ассистент тоже умеет: «перенеси вёрстку в на проверке».",
      v: "только три столбца, свой добавить нельзя." },
    { n: 5, tag: "part", h: "Что видно на карточке", p: "Название и под ним метки: важность (флажок), теги, срок (красный — срок прошёл, оранжевый — сегодня), подзадачи с полоской «1/4» и значок, если есть заметка.",
      how: "Нажмите на карточку — справа откроется вся задача (пункт 9).", v: "на карточке только название и под ним заметка; меток нет, потому что у задачи пока нет срока, важности и тегов." },
    { n: 6, tag: "new", h: "Галочка «Сделано»", p: "Кружок слева. Отметили — задача зачёркивается и сама уезжает в «Готово». Сняли галочку — возвращается туда, где была.",
      how: "Нажмите на кружок у первой задачи.", v: "галочки нет: чтобы закончить задачу, её перетаскивают в «Готово»." },
    { n: 7, tag: "has", h: "Перетаскивание", p: "Карточки перетаскиваются мышкой между столбцами и вверх-вниз внутри столбца.",
      how: "Перетащите карточку из «В процессе» в «Готово».", v: "работает точно так же." },
    { n: 8, tag: "has", h: "«+ Новая задача» в столбце", p: "Быстро добавить задачу сразу в нужный столбец — без ассистента и бесплатно: текст становится названием. Срок и остальное — в панели задачи или через полосу ассистента.",
      v: "работает так же." },
    { n: 9, tag: "new", h: "Задача целиком — панель справа", p: "Как в Notion: доска остаётся видна, а справа все подробности. Название правится прямо в заголовке. Ниже — столбец, срок (кнопки «Сегодня», «Завтра», «Без срока» или дата; время по желанию), важность (обычная, важная, срочная), теги (свои тоже можно — напишите и Enter), заметка. Внизу — когда создана или изменена, «Дублировать», «Удалить».",
      how: "Закрывается крестиком или Esc.", open: true,
      v: "панели нет. Двойной клик или карандаш меняют только название прямо на карточке. Заметку руками не добавить и не изменить — только через ассистента." },
    { n: 10, tag: "new", h: "Подзадачи", p: "Маленькие шаги внутри задачи с галочками. На карточке видно, сколько уже сделано: «2/5» и полоска.",
      how: "Откройте задачу, напишите шаг в поле «+ Подзадача», Enter. Или попросите ассистента: «разбей вёрстку сайта на шаги».", open: true, v: "подзадач нет." },
    { n: 11, tag: "part", h: "Удаление с «Отменить»", p: "Удаляем сразу, но 7 секунд внизу видна кнопка «Отменить». Быстрее, и случайно ничего не пропадёт.",
      how: "Откройте задачу → «Удалить» → внизу нажмите «Отменить».", open: true, v: "корзина на карточке и вопрос «Удалить „…“?» с кнопками «Удалить» и «Отмена»." },
    { n: 12, tag: "new", h: "Вид «Список»", p: "Задачи по срокам: «Срок прошёл» (красным), «Сегодня», «Завтра», «В ближайшие 7 дней», «Позже», «Без срока». Готовые свёрнуты в самом низу. Справа у каждой строки — в каком она столбце.",
      how: "Это удобно утром: открыл и сразу видно, что делать сегодня.", list: true, v: "только доска." },
    { n: 13, tag: "part", h: "Статистика", p: "Как вы решили, +1 получают: новая задача, переезд в другой столбец, выполнение, новая подзадача и выполненная подзадача — и руками, и через ассистента. Сообщение ассистенту задач тоже +1, как сообщение в LLM. Не считаются: правки, удаление, перестановка внутри столбца и снятая галочка.",
      how: "Нажмите на кнопку «В статистике сегодня» — там журнал: что посчиталось (+1), а что нет (—).",
      more: "Например, «смонтировать рилс завтра и позвонить Диме в пятницу» даст +3: само сообщение и две новые задачи. В блоке «Что вы чаще всего делаете» сообщение пойдёт в «Ассистент», а задачи — в «Задачи».",
      v: "уже считаются новая задача и перенос в другой столбец (значит, и в «Готово»). Подзадач и полосы ассистента пока нет." },
    { n: 14, tag: "has", h: "Счётчик на иконке «Задачи»", p: "Слева вверху, на иконке задач, — сколько задач ещё не готово. В макете он меняется сразу: добавьте задачу или отметьте галочкой.",
      v: "есть, работает так же." }
  ];
  var TAG_NAME = { "new": ["Новое", "tg-new"], has: ["Есть в 1.9.0", "tg-has"], part: ["Частично есть", "tg-part"] };
  function renderLegend() {
    var lg = $("lg");
    var cb = h("input", { type: "checkbox", checked: "checked", onchange: function () { document.body.classList.toggle("no-marks", !this.checked); } });
    lg.append(h("div", { class: "lg-top" },
      h("h2", { text: "Что на макете" }),
      h("p", { text: "Окно — как в программе 1.9.0: вкладки вверху, иконки разделов слева, «Ближайшие дела», звёздочка. Работает только раздел «Задачи»: всё нажимается, но после перезагрузки страницы возвращается как было." }),
      h("p", { text: "Цифры на макете совпадают с пунктами ниже. Нажмите на пункт — макет покажет, где это. Плашка «Сейчас в 1.9.0» — как это устроено в вышедшей версии." }),
      h("label", null, cb, "Показывать цифры на макете")));
    NOTES.forEach(function (it) {
      var tg = TAG_NAME[it.tag];
      lg.append(h("div", { class: "lg-it", id: "lg-" + it.n, onclick: function () { showNote(it); } },
        h("b", { text: String(it.n) }),
        h("div", null,
          h("h3", null, it.h, h("span", { class: "tg " + tg[1], text: tg[0] })),
          h("p", { text: it.p }),
          it.how ? h("p", { class: "how", text: it.how }) : null,
          it.more ? h("p", { text: it.more }) : null,
          it.v ? h("p", { class: "v19" }, h("b", { text: "Сейчас в 1.9.0: " }), it.v) : null,
          h("div", { class: "show", text: "Показать на макете →" }))));
    });
  }
  function showNote(it) {
    var boardOnly = [4, 5, 6, 7, 8].indexOf(it.n) !== -1;
    if (it.list && ui.view !== "list") { ui.view = "list"; render(); }
    if (boardOnly && ui.view !== "board") { ui.view = "board"; render(); }
    if (it.open && !ui.open) { var first = tasks.find(function (t) { return t.status !== "done"; }); if (first) { ui.open = first.id; render(); } }
    if (boardOnly && ui.open) { ui.open = null; render(); }
    setTimeout(function () {
      document.querySelectorAll('[data-mark="' + it.n + '"]').forEach(function (el, i) {
        if (i === 0) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        el.classList.remove("hl"); void el.offsetWidth; el.classList.add("hl");
      });
    }, 260);
  }
  // Puts a numbered circle on every element with data-mark; clicking it scrolls the explanations to that point.
  function marks(root) {
    var list = Array.prototype.slice.call(root.querySelectorAll("[data-mark]"));
    if (root.hasAttribute("data-mark")) list.unshift(root);
    list.forEach(function (el) {
      if (el.querySelector(":scope > .nb")) return;
      var n = el.getAttribute("data-mark");
      el.append(h("span", { class: "nb" + (el.classList.contains("chk") ? " l" : ""), text: n, title: "Пояснение № " + n, onclick: function (e) {
        e.stopPropagation(); e.preventDefault();
        var it = $("lg-" + n);
        if (!it) return;
        it.scrollIntoView({ block: "center", behavior: "smooth" });
        it.classList.remove("hl2"); void it.offsetWidth; it.classList.add("hl2");
        setTimeout(function () { it.classList.remove("hl2"); }, 1600);
      } }));
    });
  }

  renderLegend();
  render();
  marks(document.querySelector(".top"));
  marks(document.querySelector(".ab-wrap"));
  marks($("flt"));
})();
</script>
