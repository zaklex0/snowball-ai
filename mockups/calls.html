<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макет созвонов — Snowball.ai</title>
<!-- A mockup only: recording calls inside the 1.12.2 window. Before a call Snowball offers to record it, records the
     microphone and the computer sound, then turns the recording into text and a summary that lands in the calendar
     event; next steps go to the tasks board, agreed calls go to the calendar. The source (own recording or Wispr Flow)
     is chosen in «Настройки» → «Созвоны». Numbered marks match the explanations on the right. Not loaded by the app. -->
<link rel="stylesheet" href="../src/fonts.css">
<style>
  /* The program's colours (copied from src/styles.css, so the mockup also opens on its own) */
  :root {
    --bg: #FCEEE4; --titlebar: #F9E3D4; --surface: #FFF9F4; --surface-2: #FBE9DD; --line: #F0D7C7;
    --ink: #4B3128; --ink-soft: #8A695B; --accent: #F4AA84; --accent-ink: #3F251C; --accent-strong: #BF603D;
    --danger: #B5463B; --rec: #D43F35; --ok-bg: #DCEBD1; --ok-ink: #3B5934; --toast-bg: #4B3128; --toast-ink: #FFF4EC;
    --shadow: 0 1px 0 rgba(120, 72, 52, .05), 0 22px 44px -28px rgba(150, 85, 55, .38);
    --pop-shadow: 0 12px 32px -10px rgba(110, 60, 40, .35);
    --cat-static-dot: #4F9A40; --cat-system-dot: #D0493E;
    --ev-task: #F4AA84; --ev-task-bg: #FBDDCB; --ev-meet: #3C78C8; --ev-meet-bg: #DCE8F8; --ev-call: #9466CC; --ev-call-bg: #EADCF6;
    --ev-shoot: #D9982A; --ev-shoot-bg: #F8E7C4; --ev-edit: #2E9A92; --ev-edit-bg: #CDEDEA;
    --off-bg: color-mix(in srgb, var(--cat-system-dot) 14%, var(--surface));
    --font-display: "Unbounded", "Golos Text", "Segoe UI", system-ui, sans-serif;
    --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #251B17; --titlebar: #2C201B; --surface: #30241E; --surface-2: #3A2C25; --line: #4A372E;
      --ink: #F5E6DC; --ink-soft: #C3A596; --accent: #F2A982; --accent-ink: #2B1C16; --accent-strong: #E08A62;
      --danger: #F0907F; --rec: #F07467; --ok-bg: #2F4430; --ok-ink: #CFE6C4; --toast-bg: #F5E6DC; --toast-ink: #2B1C16;
      --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 22px 44px -28px rgba(0, 0, 0, .7); --pop-shadow: 0 14px 34px -10px rgba(0, 0, 0, .7);
      --cat-static-dot: #8CCB7C; --cat-system-dot: #F08A80;
      --ev-task: #F2A982; --ev-task-bg: #4A3326; --ev-meet: #86B4F0; --ev-meet-bg: #22364F; --ev-call: #B994E6; --ev-call-bg: #43325A;
      --ev-shoot: #F0BE5E; --ev-shoot-bg: #4A3A1B; --ev-edit: #6CCFC6; --ev-edit-bg: #1F4643;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  svg { width: 16px; height: 16px; flex: none; }
  @keyframes ev-now { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent); } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes lvl { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

  .pg { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; padding: 18px; min-height: 100vh; align-items: start; }
  @media (max-width: 1250px) { .pg { grid-template-columns: minmax(0, 1fr); } }

  /* ---- the program window, as in 1.12.2 ---- */
  .win { position: relative; display: flex; height: calc(100vh - 36px); min-height: 720px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow); }
  .side { flex: none; width: 236px; display: flex; flex-direction: column; gap: 16px; padding: 0 10px 12px; background: var(--titlebar); border-right: 1px solid var(--line); }
  .side-head { flex: none; height: 40px; margin: 0 -10px; padding: 0 16px; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
  .side-head i { width: 18px; height: 18px; border-radius: 6px; background: var(--accent); }
  .side-top { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
  .side-icons { display: flex; gap: 2px; justify-content: space-between; margin: 4px 0 16px; }
  .nav-icon { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 10px; background: none; color: var(--ink-soft); }
  .nav-icon:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--ink); }
  .nav-icon.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .nav-icon svg { width: 19px; height: 19px; }
  .nav-badge { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--accent-strong); color: #fff;
    font-size: 10.5px; font-weight: 600; line-height: 16px; text-align: center; box-shadow: 0 0 0 2px var(--titlebar); }
  .side-h { margin: 4px 11px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .up-day { margin: 8px 11px 2px; font-size: 12px; color: var(--ink-soft); }
  .up-ev { position: relative; display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border: 0; border-radius: 9px; background: none; text-align: left; font-size: 13.5px; }
  .up-ev:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .up-ev i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
  .up-ev .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up-ev .tm { font-size: 12px; color: var(--ink-soft); }
  .up-ev.now { background: color-mix(in srgb, var(--c) 16%, transparent); }
  .up-ev.now .tm { color: var(--ink); font-weight: 600; }
  .up-ev .tm.rec { color: var(--rec); font-weight: 700; }
  .up-ev .tm.rec::before { content: "● "; animation: blink 1.2s infinite; }
  .side-bottom { display: grid; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 11px; border: 0; border-radius: 11px; background: none; color: var(--ink-soft); font-size: 14px; font-weight: 500; text-align: left; }
  .nav-item:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--ink); }
  .nav-item svg { width: 19px; height: 19px; }
  .profile-row { display: flex; gap: 8px; margin-top: 4px; }
  .profile-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); text-align: left; }
  .avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; }
  .profile-name { flex: 1; font-size: 14px; font-weight: 600; }
  .qa-btn { flex: none; width: 46px; display: grid; place-items: center; border: 0; border-radius: 13px; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .qa-btn svg { width: 21px; height: 21px; }

  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .titlebar { flex: none; height: 40px; display: flex; align-items: flex-end; gap: 2px; padding: 0 0 0 8px; background: var(--titlebar); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
  .tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; overflow: hidden; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; width: 190px; flex: 0 1 190px; min-width: 0; padding: 0 6px 0 12px; margin-bottom: -1px;
    border: 1px solid transparent; border-bottom: 0; border-radius: 10px 10px 0 0; background: none; color: var(--ink-soft); text-align: left; font-weight: 500; }
  .tab:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); color: var(--ink); }
  .tab.on { background: var(--bg); color: var(--ink); border-color: var(--line); z-index: 1; }
  .tab .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .x { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; opacity: 0; }
  .tab.on .x { opacity: 1; }
  .tab .x svg { width: 11px; height: 11px; }
  .tab-plus { align-self: center; display: grid; place-items: center; width: 30px; height: 30px; margin-left: 4px; border: 0; border-radius: 9px; background: none; color: var(--ink-soft); }
  .wbtn { margin-left: auto; align-self: stretch; display: flex; }
  .wbtn span { width: 46px; display: grid; place-items: center; font-size: 12px; color: var(--ink-soft); }

  .mn { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .scroller { flex: 1; min-height: 0; overflow: auto; }
  .page { max-width: 1160px; margin: 0 auto; padding: 26px 28px 40px; display: grid; gap: 16px; }

  /* the strip under the tabs: offer to record, recording, processing, ready */
  .strip { position: relative; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .strip.offer { background: color-mix(in srgb, var(--ev-call) 13%, var(--surface)); }
  .strip.rec { background: color-mix(in srgb, var(--rec) 10%, var(--surface)); }
  .strip.proc, .strip.ready { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  .strip .ico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--surface); color: var(--ev-call); box-shadow: inset 0 0 0 1px var(--line); }
  .strip.rec .ico { color: var(--rec); }
  .strip .txt { flex: 1; min-width: 220px; display: grid; }
  .strip .txt b { font-weight: 600; }
  .strip .txt small { font-size: 12.5px; color: var(--ink-soft); }
  .dot-rec { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--rec); margin-right: 7px; animation: blink 1.2s infinite; vertical-align: 1px; }
  .paused .dot-rec { animation: none; background: var(--ink-soft); }
  .clock { font-family: var(--font-mono); font-weight: 600; font-size: 15px; min-width: 62px; }
  .levels { display: flex; gap: 14px; font-size: 12px; color: var(--ink-soft); }
  .lv { display: flex; align-items: center; gap: 6px; }
  .lv span { display: flex; align-items: center; gap: 2px; height: 18px; }
  .lv span i { width: 3px; height: 16px; border-radius: 2px; background: var(--cat-static-dot); transform-origin: center; animation: lvl .9s ease-in-out infinite; }
  .lv span i:nth-child(2) { animation-delay: -.3s; } .lv span i:nth-child(3) { animation-delay: -.6s; } .lv span i:nth-child(4) { animation-delay: -.15s; } .lv span i:nth-child(5) { animation-delay: -.45s; }
  .lv.quiet span i { animation-duration: 1.7s; opacity: .55; }
  .paused .lv span i { animation: none; transform: scaleY(.2); opacity: .5; }
  .strip.click { cursor: pointer; }
  .strip.click:hover { background: color-mix(in srgb, var(--rec) 15%, var(--surface)); }

  /* the live transcript under the recording strip */
  #strip { position: relative; flex: none; z-index: 25; }
  #strip > .live { position: absolute; left: 0; right: 0; top: 100%; display: flex; flex-direction: column; max-height: 340px; background: var(--surface); border-bottom: 1px solid var(--line);
    box-shadow: 0 22px 34px -22px rgba(90, 50, 30, .5); }
  .live-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-soft); }
  .live-h b { color: var(--ink); font-size: 13px; }
  .live-h .btn { margin-left: auto; }
  .live-b { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 16px; display: grid; align-content: start; gap: 8px; }
  .lv-line { display: grid; grid-template-columns: 46px 96px minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.5; }
  .lv-line .tm { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); padding-top: 2px; }
  .lv-line .sp { font-weight: 600; color: var(--ev-meet); }
  .lv-line .sp.me { color: var(--accent-strong); }
  .lv-line.cur .tx::after { content: "▍"; margin-left: 1px; color: var(--ink-soft); animation: blink .8s infinite; }
  .live-end { font-size: 13px; color: var(--ink-soft); }
  .prog { width: 180px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .prog b { display: block; height: 100%; width: 0; background: var(--accent-strong); transition: width .25s linear; }

  .btn { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.pri { border-color: transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.pri:hover { filter: brightness(.97); }
  .btn.red { border-color: transparent; background: var(--rec); color: #fff; font-weight: 600; }
  .btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 10px; }
  .btn.ghost { background: none; border-color: transparent; color: var(--ink-soft); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn:disabled { opacity: .55; cursor: default; }

  /* header and calendar */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
  .top-text { display: grid; gap: 8px; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; }
  .meta { margin: 0; color: var(--ink-soft); font-size: 14px; }
  .top-actions { display: flex; gap: 10px; }
  .cal-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .cal-toolbar h2 { margin: 0 0 0 6px; font-size: 18px; font-weight: 600; }
  .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink-soft); }
  .fake-now { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--line); }
  .cw { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
  .cw-head { display: grid; grid-template-columns: 52px repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .cw-day { padding: 8px 12px; font-size: 13px; color: var(--ink-soft); border-left: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .cw-day b { display: grid; place-items: center; min-width: 30px; height: 30px; border-radius: 50%; font-size: 16px; color: var(--ink); }
  .cw-day.today b { background: var(--accent); color: var(--accent-ink); }
  .cw-day.off { background: var(--off-bg); }
  .cw-body { display: grid; grid-template-columns: 52px repeat(3, minmax(0, 1fr)); }
  .cw-hours div { height: 46px; padding: 0 8px; font-size: 11.5px; color: var(--ink-soft); text-align: right; transform: translateY(-8px); }
  .cw-col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0 45px, var(--line) 45px 46px); }
  .cw-col.off { background-color: color-mix(in srgb, var(--off-bg) 55%, transparent); }
  .cal-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--rec); z-index: 0; }
  .cal-now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--rec); }
  .ev { position: absolute; left: 4px; right: 4px; z-index: 1; display: block; padding: 4px 26px 4px 9px; border: 0; border-left: 3px solid var(--c); border-radius: 9px; background: var(--bg-c);
    text-align: left; font-size: 12.5px; line-height: 1.35; overflow: hidden; }
  .ev:hover { filter: brightness(.98); box-shadow: 0 2px 8px -3px rgba(0, 0, 0, .25); }
  .ev .tm { color: var(--ink-soft); }
  .ev.now { animation: ev-now 2.4s ease-in-out infinite; }
  .ev.recording { box-shadow: 0 0 0 2px var(--rec); animation: none; }
  .ev .flag { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--surface); color: var(--c); }
  .ev .flag svg { width: 13px; height: 13px; }
  .ev .flag.rec { color: var(--rec); animation: blink 1.2s infinite; }
  .ev-task { --c: var(--ev-task); --bg-c: var(--ev-task-bg); } .ev-meet { --c: var(--ev-meet); --bg-c: var(--ev-meet-bg); } .ev-call { --c: var(--ev-call); --bg-c: var(--ev-call-bg); }
  .ev-shoot { --c: var(--ev-shoot); --bg-c: var(--ev-shoot-bg); } .ev-edit { --c: var(--ev-edit); --bg-c: var(--ev-edit-bg); }
  .ev.fresh { animation: fresh 1.6s ease-out; }
  @keyframes fresh { 0%, 50% { box-shadow: 0 0 0 3px var(--accent-strong); } }
  .foot { margin: 0; font-size: 13px; color: var(--ink-soft); }

  /* dialogs inside the window */
  .back { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: rgba(30, 18, 12, .45); }
  .dlg { position: relative; width: min(700px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 20px; background: var(--surface); box-shadow: var(--pop-shadow); overflow: hidden; }
  .dlg.wide { width: min(940px, 100%); height: min(640px, 100%); }
  .dlg-h { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 18px 16px 12px 22px; border-bottom: 1px solid var(--line); }
  .dlg-h h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 19px; letter-spacing: -0.01em; }
  .dlg-h p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kind { display: inline-flex; align-items: center; gap: 5px; padding: 0 9px; border-radius: 999px; background: var(--bg-c); color: var(--ink); font-size: 12.5px; }
  .kind i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .x-btn { display: grid; place-items: center; width: 34px; height: 34px; margin-left: auto; border: 0; border-radius: 10px; background: none; color: var(--ink-soft); }
  .x-btn:hover { background: var(--surface-2); color: var(--ink); }
  .dlg-tabs { display: flex; gap: 4px; padding: 10px 22px 0; }
  .seg { position: relative; display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg button { padding: 6px 14px; border: 0; border-radius: 9px; background: none; color: var(--ink-soft); font-size: 13.5px; font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  .seg button:disabled { opacity: .45; cursor: default; }
  .dlg-b { flex: 1; min-height: 0; overflow: auto; padding: 16px 22px 20px; display: grid; align-content: start; gap: 16px; }
  .dlg-f { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); }
  .src { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: var(--ink-soft); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); font-size: 12.5px; font-weight: 500; }
  .pill.wispr { background: color-mix(in srgb, var(--ev-meet) 18%, var(--surface)); }
  .blk { position: relative; display: grid; gap: 7px; }
  .blk h5 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .blk p { margin: 0; line-height: 1.55; }
  .blk ul { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
  .steps { display: grid; gap: 4px; }
  .step { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
  .step input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent-strong); }
  .step .who { display: flex; gap: 6px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .step .who span { padding: 1px 8px; border-radius: 999px; background: var(--surface-2); }
  .step.added { opacity: .7; }
  .step.added .t::after { content: " · на доске"; color: var(--ok-ink); font-size: 12px; font-weight: 600; }
  .row-act { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ok-note { font-size: 13px; color: var(--ok-ink); font-weight: 600; }

      more: "Нужно проверить, прежде чем делать: пускает ли Wispr Flow чужие программы к записям встреч. Если нет — вариант уберём, своя запись останется." },
    { n: 13, tag: "part", step: 4, dlg: "dima", tab: "sum", h: "Спросить про созвон в LLM", p: "Кнопка внизу окна открывает вкладку LLM, где ассистент уже знает итоги и расшифровку. Можно спросить «напиши Диме письмо с итогами» или «что мы решили с Мариной про тарифы?» — ассистент найдёт нужный созвон сам.",
      now: "ассистент видит дела календаря, но не итоги — их пока нет." },
    { n: 14, tag: "new", set: true, h: "Где хранится", p: "Итоги и расшифровка — в папке с данными рядом с календарём, всегда, и попадают в резервную копию. Аудио — по выбору: удалить сразу после расшифровки (по умолчанию, меньше места), хранить 30 дней или всегда." },
    { n: 15, tag: "has", dlg: "dima", tab: "ev", h: "Само дело — как сейчас", p: "Вкладка «Дело» — привычная форма: что, день, время, тип, заметка. Если итогов ещё нет, вкладок «Итоги» и «Расшифровка» не нажать.",
      now: "форма дела работает так же." },
    { n: 16, tag: "new", step: 2, live: true, h: "Живой текст разговора", p: "Во время созвона нажмите на красную полосу записи — под ней откроется панель, где разговор пишется текстом: время, кто говорит («Вы» или «Собеседник») и что сказал. Новые строчки появляются внизу сами, панель прокручивается за ними. Если прокрутить вверх, чтобы перечитать, панель не будет дёргать вниз.",
      how: "Шаг 2 сценария → нажмите на полосу или «Текст ▾». Подождите — строчки начнут появляться. Нажмите «Пауза»: текст тоже встанет.",
      more: "Как это работает: каждые 5–10 секунд кусочек записи уходит в OpenAI, поэтому текст отстаёт на несколько секунд и бывает чуть грубее. Кто говорит, программа знает точно: «Вы» — это микрофон, «Собеседник» — звук компьютера. После созвона итоги делаются по всему разговору целиком, поэтому там текст аккуратнее, а собеседник подписан по имени из дела («Дима»). Нужен интернет весь созвон: если он пропадёт, запись не прервётся, а текст догонит позже. С Wispr Flow живого текста нет — он отдаёт расшифровку только после встречи." }
  ];
  var TAG_NAME = { "new": ["Новое", "tg-new"], has: ["Есть в 1.12.2", "tg-has"], part: ["Частично есть", "tg-part"], check: ["Нужно проверить", "tg-check"] };
  var SCENE = [[1, "До созвона: «Записать?»"], [2, "Идёт запись"], [3, "Запись закончилась: делаю итоги"], [4, "Итоги готовы"]];
  function renderLegend() {
    var lg = $("lg");
    var cb = h("input", { type: "checkbox", checked: "checked", onchange: function () { document.body.classList.toggle("no-marks", !this.checked); } });
    lg.append(h("div", { class: "lg-top" },
      h("h2", { text: "Что на макете" }),
      h("p", { text: "Окно — как в программе 1.12.2, открыт «Календарь» в виде «3 дня». Сегодня в 15:00 созвон с Димой. В макете своё время, чтобы пройти весь путь созвона по шагам:" }),
      h("div", { class: "scn" }, SCENE.map(function (s) {
        return h("button", { type: "button", "data-step": s[0], onclick: function () { st.dlg = null; st.settings = false; go(s[0]); } }, h("b", { text: String(s[0]) }), s[1]);
      })),
      h("p", { text: "Цифры на макете совпадают с пунктами ниже. Нажмите на пункт — макет покажет, где это. Плашка «Сейчас в 1.12.2» — как это устроено в вышедшей версии." }),
      h("label", null, cb, "Показывать цифры на макете")));
    NOTES.forEach(function (it) {
      var tg = TAG_NAME[it.tag];
      lg.append(h("div", { class: "lg-it", id: "lg-" + it.n, onclick: function () { showNote(it); } },
        h("b", { text: String(it.n) }),
        h("div", null,
          h("h3", null, it.h, h("span", { class: "tg " + tg[1], text: tg[0] })),
          h("p", { text: it.p }),
          it.how ? h("p", { class: "how", text: it.how }) : null,
          it.more ? h("p", { text: it.more }) : null,
          it.now ? h("p", { class: "now" }, h("b", { text: "Сейчас в 1.12.2: " }), it.now) : null,
          h("div", { class: "show", text: "Показать на макете →" }))));
    });
  }
  function showNote(it) {
    if (it.step && it.step !== st.step) { st.dlg = null; st.settings = false; go(it.step); }
    if (it.step === 4 && st.step !== 4) return;
    if (it.set) { st.settings = true; st.dlg = null; }
    else { st.settings = false; }
    if (it.dlg) {
      if (it.dlg === "dima" && it.tab !== "ev" && st.step !== 4) { go(4); }
      st.dlg = it.dlg; st.tab = it.tab; st.q = "";
    } else if (!it.set) st.dlg = null;
    if (it.live) {
      if (st.source !== "own") { st.source = "own"; go(2); }
      st.live = true; st.paused = false;
    }
    if (it.n === 1) st.offerHidden = false;
    if (it.n === 5 && st.step === 4) st.readyHidden = false;
    render();
    setTimeout(function () {
      document.querySelectorAll('[data-mark="' + it.n + '"]').forEach(function (el, i) {
        if (i === 0) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        el.classList.remove("hl"); void el.offsetWidth; el.classList.add("hl");
      });
    }, 200);
  }
  // Puts a numbered circle on every element with data-mark; clicking it scrolls the explanations to that point.
  function marks(root) {
    if (!root) return;
    var list = Array.prototype.slice.call(root.querySelectorAll("[data-mark]"));
    if (root.hasAttribute && root.hasAttribute("data-mark")) list.unshift(root);
    list.forEach(function (el) {
      if (el.querySelector(":scope > .nb")) return;
      var n = el.getAttribute("data-mark");
      el.append(h("span", { class: "nb", text: n, title: "Пояснение № " + n, onclick: function (e) {
        e.stopPropagation(); e.preventDefault();
        var it = $("lg-" + n);
        if (!it) return;
        it.scrollIntoView({ block: "center", behavior: "smooth" });
        it.classList.remove("hl2"); void it.offsetWidth; it.classList.add("hl2");
        setTimeout(function () { it.classList.remove("hl2"); }, 1600);
      } }));
    });
  }

  renderLegend();
  render();
})();
