<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макет транскрибации — Snowball.ai</title>
<!-- A mockup only: the new «Транскрибация» section inside the 1.14.0 window. An audio or video file → text, timings
     by phrases (put on real pauses of the voice), .srt subtitles, a short summary, and the history of files.
     It works the way tools/record-test checked: the sound is cut at pauses and gpt-4o-mini-transcribe turns the pieces
     into text. Numbered marks match the explanations on the right. Not loaded by the app. -->
<link rel="stylesheet" href="../src/fonts.css">
<style>
  /* The program's colours (copied from src/styles.css, so the mockup also opens on its own) */
  :root {
    --bg: #FCEEE4; --titlebar: #F9E3D4; --surface: #FFF9F4; --surface-2: #FBE9DD; --line: #F0D7C7;
    --ink: #4B3128; --ink-soft: #8A695B; --accent: #F4AA84; --accent-ink: #3F251C; --accent-strong: #BF603D;
    --danger: #B5463B; --ok-bg: #DCEBD1; --ok-ink: #3B5934; --toast-bg: #4B3128; --toast-ink: #FFF4EC;
    --video: #3C78C8; --video-bg: #DCE8F8; --wave: #2E9A92;
    --shadow: 0 1px 0 rgba(120, 72, 52, .05), 0 22px 44px -28px rgba(150, 85, 55, .38);
    --pop-shadow: 0 12px 32px -10px rgba(110, 60, 40, .35);
    --font-display: "Unbounded", "Golos Text", "Segoe UI", system-ui, sans-serif;
    --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #251B17; --titlebar: #2C201B; --surface: #30241E; --surface-2: #3A2C25; --line: #4A372E;
      --ink: #F5E6DC; --ink-soft: #C3A596; --accent: #F2A982; --accent-ink: #2B1C16; --accent-strong: #E08A62;
      --danger: #F0907F; --ok-bg: #2F4430; --ok-ink: #CFE6C4; --toast-bg: #F5E6DC; --toast-ink: #2B1C16;
      --video: #86B4F0; --video-bg: #22364F; --wave: #6CCFC6;
      --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 22px 44px -28px rgba(0, 0, 0, .7); --pop-shadow: 0 14px 34px -10px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  svg { width: 16px; height: 16px; flex: none; }

  .pg { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; padding: 18px; min-height: 100vh; align-items: start; }
  @media (max-width: 1250px) { .pg { grid-template-columns: minmax(0, 1fr); } }

  /* ---- the program window, as in 1.14.0 ---- */
  .win { position: relative; display: flex; height: calc(100vh - 36px); min-height: 760px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow); }
  .side { flex: none; width: 236px; display: flex; flex-direction: column; gap: 16px; padding: 0 10px 12px; background: var(--titlebar); border-right: 1px solid var(--line); }
  .side-head { flex: none; height: 40px; margin: 0 -10px; padding: 0 16px; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
  .side-head i { width: 18px; height: 18px; border-radius: 6px; background: var(--accent); }
  .side-top { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
  .side-icons { display: flex; gap: 0; justify-content: space-between; margin: 4px 0 16px; }
  .nav-icon { position: relative; display: grid; place-items: center; width: 30px; height: 34px; border: 0; border-radius: 10px; background: none; color: var(--ink-soft); }
  .nav-icon:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--ink); }
  .nav-icon.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .nav-icon svg { width: 19px; height: 19px; }
  .nav-badge { position: absolute; top: 1px; right: -2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--accent-strong); color: #fff;
    font-size: 10.5px; font-weight: 600; line-height: 16px; text-align: center; box-shadow: 0 0 0 2px var(--titlebar); }
  .side-h { margin: 4px 11px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .up-day { margin: 8px 11px 2px; font-size: 12px; color: var(--ink-soft); }
  .up-ev { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border: 0; border-radius: 9px; background: none; text-align: left; font-size: 13.5px; }
  .up-ev i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
  .up-ev .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up-ev .tm { font-size: 12px; color: var(--ink-soft); }
  .side-bottom { display: grid; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 11px; border: 0; border-radius: 11px; background: none; color: var(--ink-soft); font-size: 14px; font-weight: 500; text-align: left; }
  .nav-item svg { width: 19px; height: 19px; }
  .profile-row { display: flex; gap: 8px; margin-top: 4px; }
  .profile-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); text-align: left; }
  .avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; }
  .profile-name { flex: 1; font-size: 14px; font-weight: 600; }
  .qa-btn { flex: none; width: 46px; display: grid; place-items: center; border: 0; border-radius: 13px; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .qa-btn svg { width: 21px; height: 21px; }

  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .titlebar { flex: none; height: 40px; display: flex; align-items: flex-end; gap: 2px; padding: 0 0 0 8px; background: var(--titlebar); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
  .tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; overflow: hidden; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; width: 190px; flex: 0 1 190px; min-width: 0; padding: 0 6px 0 12px; margin-bottom: -1px;
    border: 1px solid transparent; border-bottom: 0; border-radius: 10px 10px 0 0; background: none; color: var(--ink-soft); text-align: left; font-weight: 500; }
  .tab.on { background: var(--bg); color: var(--ink); border-color: var(--line); z-index: 1; }
  .tab .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .x { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; opacity: 0; }
  .tab.on .x { opacity: 1; }
  .tab .x svg { width: 11px; height: 11px; }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-strong); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .tab-plus { align-self: center; display: grid; place-items: center; width: 30px; height: 30px; margin-left: 4px; border: 0; border-radius: 9px; background: none; color: var(--ink-soft); }
  .wbtn { margin-left: auto; align-self: stretch; display: flex; }
  .wbtn span { width: 46px; display: grid; place-items: center; font-size: 12px; color: var(--ink-soft); }

  .mn { position: relative; flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .scroller { flex: 1; min-width: 0; overflow: auto; }
  .page { max-width: 980px; margin: 0 auto; padding: 26px 28px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @media (max-width: 1000px) { .page { padding: 20px 16px 32px; } .hist { width: 210px; } .cue { grid-template-columns: 1fr; gap: 0; } }

  /* history on the right */
  .hist { position: relative; flex: none; width: 270px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 50%, var(--bg)); }
  .hist-h { display: flex; align-items: center; gap: 8px; padding: 16px 14px 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
  .hist-s { margin: 0 12px 8px; display: flex; align-items: center; gap: 7px; padding: 0 10px; height: 34px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink-soft); }
  .hist-s input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 13.5px; color: var(--ink); }
  .hist-l { flex: 1; overflow: auto; padding: 0 8px 12px; display: grid; align-content: start; gap: 2px; }
  .hist-day { margin: 8px 6px 2px; font-size: 12px; color: var(--ink-soft); }
  .hi { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr) 22px; gap: 9px; align-items: center; width: 100%; padding: 8px; border: 0; border-radius: 11px; background: none; text-align: left; font-size: 13.5px; }
  .hi:hover { background: var(--surface); }
  .hi.on { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .hi .ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--video-bg); color: var(--video); }
  .hi .ic.au { background: color-mix(in srgb, var(--wave) 20%, var(--surface)); color: var(--wave); }
  .hi .nm { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .hi .sb { display: block; font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hi .del { opacity: 0; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--ink-soft); }
  .hi:hover .del { opacity: 1; }
  .hi .del svg { width: 12px; height: 12px; }
  .hi .run { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-strong); animation: blink 1.2s infinite; }

  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
  .top-text { display: grid; gap: 8px; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; }
  .meta { margin: 0; color: var(--ink-soft); font-size: 14px; }

  .btn { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.pri { border-color: transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 10px; }
  .btn.ghost { background: none; border-color: transparent; color: var(--ink-soft); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .card { position: relative; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }

  /* drop zone */
  .drop { position: relative; display: grid; justify-items: center; gap: 10px; padding: 34px 20px; border: 2px dashed var(--line); border-radius: 18px; background: var(--surface); text-align: center; }
  .drop.over { border-color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .drop .big { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: color-mix(in srgb, var(--accent) 26%, var(--surface)); color: var(--accent-strong); }
  .drop .big svg { width: 28px; height: 28px; }
  .drop b { font-size: 17px; }
  .drop p { margin: 0; font-size: 13.5px; color: var(--ink-soft); max-width: 520px; }
  .drop.small { grid-template-columns: auto 1fr auto; justify-items: start; text-align: left; padding: 12px 14px; gap: 12px; border-style: dashed; }
  .drop.small .big { width: 40px; height: 40px; border-radius: 12px; }
  .drop.small .big svg { width: 20px; height: 20px; }
  .drop.small b { font-size: 14.5px; }

  /* the picked file */
  .file { display: grid; gap: 14px; padding: 16px 18px; }
  .file-h { display: flex; align-items: center; gap: 12px; }
  .file-h .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--video-bg); color: var(--video); }
  .file-h .ic svg { width: 22px; height: 22px; }
  .file-h .nm { flex: 1; min-width: 0; }
  .file-h .nm b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-h .nm span { font-size: 13px; color: var(--ink-soft); }
  .opts { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 14px; }
  .opts select { height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 14px; }
  .price { font-size: 13px; color: var(--ink-soft); }
  .prog { display: grid; gap: 6px; }
  .prog .bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
  .prog .bar b { display: block; height: 100%; background: var(--accent-strong); transition: width .2s linear; }
  .prog small { font-size: 13px; color: var(--ink-soft); }

  /* the result */
  .res { display: grid; gap: 0; overflow: hidden; }
  .player { position: relative; display: grid; gap: 0; background: #1c1411; }
  .frame { position: relative; aspect-ratio: 16 / 7; background: linear-gradient(135deg, #3a2a3f, #1f3a4a 55%, #2d2016); overflow: hidden; }
  .frame::before { content: ""; position: absolute; inset: 18% 30% 30% 30%; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 50% 40%, rgba(255, 220, 190, .35), transparent 65%); }
  .frame .sub { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); max-width: 80%; padding: 4px 12px; border-radius: 8px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 17px; line-height: 1.35; text-align: center; white-space: pre-line; }
  .ctrl { display: flex; align-items: center; gap: 12px; padding: 8px 14px; color: #f4e6dc; font-size: 13px; }
  .ctrl button { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .12); color: #fff; }
  .ctrl .tl { position: relative; flex: 1; height: 26px; cursor: pointer; }
  .ctrl .tl i { position: absolute; top: 9px; height: 8px; border-radius: 3px; background: rgba(255, 255, 255, .28); }
  .ctrl .tl i.on { background: var(--accent); }
  .ctrl .tl em { position: absolute; top: 2px; bottom: 2px; width: 2px; background: #fff; }
  .ctrl .time { font-family: var(--font-mono); min-width: 110px; text-align: right; }
  .rtabs { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .seg { position: relative; display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg button { padding: 6px 14px; border: 0; border-radius: 9px; background: none; color: var(--ink-soft); font-size: 13.5px; font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  .rtabs .sp { flex: 1; }
  .rbody { padding: 14px 16px 18px; }
  .txt { width: 100%; min-height: 220px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 15px; line-height: 1.65; resize: vertical; outline: none; }
  .txt:focus { border-color: var(--accent); }
  .hint { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .cues { display: grid; gap: 2px; }
  .cue { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 10px; padding: 7px 10px; border: 0; border-radius: 10px; background: none; text-align: left; font-size: 14.5px; line-height: 1.5; }
  .cue:hover { background: var(--surface-2); }
  .cue.now { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
  .cue .tm { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); padding-top: 2px; }
  .copyfmt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: var(--ink-soft); }
  .sum h5 { margin: 14px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .sum h5:first-child { margin-top: 0; }
  .sum p { margin: 0; line-height: 1.6; }
  .sum ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .sum .empty { display: grid; justify-items: start; gap: 10px; padding: 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--ink-soft); font-size: 14px; }
  .acts { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .acts .info { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); }

  .tst { position: absolute; left: 50%; bottom: 18px; z-index: 60; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; max-width: calc(100% - 40px); padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-ink); font-size: 14px; box-shadow: var(--pop-shadow); }
  .tst button { border: 0; background: color-mix(in srgb, var(--toast-ink) 16%, transparent); color: var(--toast-ink); padding: 5px 11px; border-radius: 8px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }

  /* ---- numbered marks and the explanations ---- */
  [data-mark] { position: relative; }
  .nb { position: absolute; top: -9px; right: -9px; z-index: 9; display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px;
    background: var(--accent-strong); color: #fff; font: 700 12px/1 var(--font-body); box-shadow: 0 0 0 2px var(--bg); cursor: help; }
  .player > .nb, .hist > .nb, .res > .nb { top: 8px; right: 8px; }
  .nav-icon > .nb { top: auto; bottom: -12px; right: -6px; }
  .no-marks .nb { display: none; }
  .hl { animation: hl 1.6s ease-out; }
  @keyframes hl { 0%, 60% { box-shadow: 0 0 0 4px var(--accent-strong); border-radius: 12px; } 100% { box-shadow: 0 0 0 4px transparent; } }

  .lg { position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow: auto; display: grid; gap: 10px; align-content: start; }
  .lg-top { padding: 16px 18px; border-radius: 16px; border: 1px dashed var(--ink-soft); background: var(--surface); font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }
  .lg-top h2 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 500; font-size: 19px; color: var(--ink); }
  .lg-top p { margin: 0 0 8px; }
  .lg-top label { display: flex; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; }
  .scn { display: grid; gap: 5px; margin: 4px 0 12px; }
  .scn button { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); font-size: 13.5px; text-align: left; color: var(--ink); }
  .scn button b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); font-size: 12px; }
  .scn button.on { border-color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-weight: 600; }
  .scn button.on b { background: var(--accent-strong); color: #fff; }
  .lg-it { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; line-height: 1.5; cursor: pointer; }
  .lg-it:hover, .lg-it.hl2 { border-color: var(--accent-strong); }
  .lg-it > b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; background: var(--accent-strong); color: #fff; font-size: 12px; }
  .lg-it h3 { margin: 0 0 3px; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .lg-it p { margin: 0; color: var(--ink-soft); }
  .lg-it p + p { margin-top: 5px; }
  .lg-it .how { color: var(--ink); }
  .lg-it p.now { margin-top: 7px; padding: 6px 9px; border-radius: 9px; background: var(--surface-2); color: var(--ink); font-size: 12.5px; }
  .tg { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; }
  .tg-new { background: var(--ok-bg); color: var(--ok-ink); }
  .tg-has { background: var(--surface-2); color: var(--ink-soft); }
  .tg-part { background: color-mix(in srgb, #D9982A 24%, var(--surface)); color: var(--ink); }
  .tg-test { background: color-mix(in srgb, var(--video) 22%, var(--surface)); color: var(--ink); }
  .lg-it .show { margin-top: 6px; font-size: 12.5px; color: var(--accent-strong); font-weight: 600; }
</style>
</head>
<body>
<div class="pg">
  <div class="win">
