<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Центрирование цифр — проверочная страница</title><link rel="stylesheet" href="../src/fonts.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;color:#1d1d1f;background:#f7f8fa;font:14px 'Golos Text','Segoe UI',sans-serif}h1{font-size:23px;font-weight:500;margin:0 0 12px}p{color:#74767d;margin:0 0 25px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:15px;max-width:1150px}.cell{background:#fff;border:1px solid #e3e5e8;border-radius:10px;padding:17px}.samples{display:flex;gap:24px;align-items:center;min-height:108px}.zoom{width:108px;height:108px;position:relative}.zoom>.circle{transform:scale(6);transform-origin:top left}.circle{box-sizing:border-box;position:relative;width:18px;height:18px;border:1px solid #97b9e7;border-radius:50%;background:transparent;color:#516f95;padding:0;font:400 11px 'Golos Text',sans-serif;flex:none}.cell-label{font-size:12px;color:#777980;margin-top:13px}.coordinates{font-size:11px;color:#777980;line-height:1.6;margin-top:5px;font-variant-numeric:tabular-nums}.toolbar{margin-bottom:22px;display:flex;gap:20px;align-items:center}label{display:flex;align-items:center;gap:6px;font-size:12px;color:#74767d}@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(140px,1fr))}}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(120px,1fr))}body{padding:16px}}
</style></head><body><h1>Один холст — один центр</h1><p>Кружок и видимая область цифры имеют общую точку центра: X = 9, Y = 9.<br>Слева — обычный размер, справа — увеличение в шесть раз.</p><div class="toolbar"><label><input id="guides" type="checkbox" checked>Показать оси центра и границы цифры</label></div><div class="grid" id="grid"></div><script src="task-number-stamp.js"></script><script>
'use strict';
function render(){const grid=document.getElementById('grid');grid.replaceChildren();for(const number of [1,2,3,4,5,6,7,8,9,0,10,11,12,20,100]){const cell=document.createElement('section');cell.className='cell';const samples=document.createElement('div');samples.className='samples';const normal=document.createElement('button');normal.className='circle';normal.setAttribute('aria-label','Номер '+number);const zoom=document.createElement('div');zoom.className='zoom';const large=normal.cloneNode(false);zoom.append(large);samples.append(normal,zoom);cell.append(samples);const label=document.createElement('div');label.className='cell-label';label.textContent='Номер '+number;cell.append(label);grid.append(cell);const a=SnowTaskNumberStamp.paint(normal,number),b=SnowTaskNumberStamp.paint(large,number,document.getElementById('guides').checked);const coords=document.createElement('div');coords.className='coordinates';coords.textContent='Центр круга: '+a.centre.join(', ')+' · цифры: '+a.inkCentre.join(', ');cell.append(coords)}}
document.getElementById('guides').onchange=render;document.fonts.ready.then(render);
</script></body></html>
