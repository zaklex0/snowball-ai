<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макет инструкции к обновлению — Snowball.ai</title>
<!-- A mockup only: how a picture guide «Как пользоваться» could come with every update. Example: 1.15.0, «Транскрибация».
     Two ways to show it: A — a step-by-step window right after the update; B — a page in «Настройки» → «Обновление».
     The screenshots are the ones the program ships (src/guides/1.15.0, taken by tools/guide-shots/run.js on a demo video), and the
     frames and arrows point to boxes measured on them. Numbered marks match the explanations on the right. -->
<link rel="stylesheet" href="../src/fonts.css">
<style>
  :root {
    --bg: #FCEEE4; --titlebar: #F9E3D4; --surface: #FFF9F4; --surface-2: #FBE9DD; --line: #F0D7C7;
    --ink: #4B3128; --ink-soft: #8A695B; --accent: #F4AA84; --accent-ink: #3F251C; --accent-strong: #BF603D;
    --ok-bg: #DCEBD1; --ok-ink: #3B5934; --mark: #E0532F; --label-bg: #3A241C; --label-ink: #FFF4EC;
    --shadow: 0 1px 0 rgba(120, 72, 52, .05), 0 22px 44px -28px rgba(150, 85, 55, .38);
    --pop-shadow: 0 20px 50px -14px rgba(80, 40, 25, .45);
    --font-display: "Unbounded", "Golos Text", "Segoe UI", system-ui, sans-serif;
    --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #251B17; --titlebar: #2C201B; --surface: #30241E; --surface-2: #3A2C25; --line: #4A372E;
      --ink: #F5E6DC; --ink-soft: #C3A596; --accent: #F2A982; --accent-ink: #2B1C16; --accent-strong: #F7BE9E;
      --ok-bg: #2F4430; --ok-ink: #CFE6C4; --mark: #FF7A55; --label-bg: #FFF4EC; --label-ink: #2B1C16;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .pg { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; padding: 18px; align-items: start; }
  @media (max-width: 1300px) { .pg { grid-template-columns: minmax(0, 1fr); } }

  .switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .switch button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; }
  .switch button.on { border-color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); font-weight: 600; }

  /* the program window behind: a real screenshot, dimmed when a window is open over it */
  .stage { position: relative; aspect-ratio: 1280 / 820; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #000; }
  .stage > img.bgshot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage .dim { position: absolute; inset: 0; background: rgba(30, 18, 12, .55); }
  .banner { position: absolute; left: 21%; right: 3%; top: 6.5%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent-strong); box-shadow: var(--pop-shadow); font-size: 14px; }
  .banner p { margin: 0; flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .btn.pri { border-color: transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.ghost { background: none; border-color: transparent; color: var(--ink-soft); }
  .btn:disabled { opacity: .4; cursor: default; }

  /* Variant A: the step-by-step window */
  .tour { position: absolute; inset: 3% 3%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-radius: 18px; background: var(--surface); box-shadow: var(--pop-shadow); overflow: hidden; }
  .tour-h { display: flex; align-items: center; gap: 12px; padding: 12px 16px 10px 20px; border-bottom: 1px solid var(--line); }
  .tour-h h2 { margin: 0; font: 500 17px/1.2 var(--font-display); }
  .tour-h .ver { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-ink); }
  .tour-h .x { margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 9px; background: none; color: var(--ink-soft); font-size: 18px; }
  .tour-b { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  .tour-pic { position: relative; padding: 14px; background: var(--surface-2); display: grid; align-content: center; min-height: 0; overflow: auto; }
  .tour-txt { padding: 16px 18px; overflow: auto; border-left: 1px solid var(--line); }
  .tour-txt h3 { margin: 0 0 4px; font-size: 17px; }
  .tour-txt .lead { margin: 0 0 12px; color: var(--ink-soft); font-size: 13.5px; }
  .tour-f { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .dots { display: flex; gap: 5px; margin-right: auto; }
  .dots button { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 50%; background: var(--line); }
  .dots button.on { background: var(--accent-strong); width: 22px; border-radius: 9px; }
  .count { font-size: 13px; color: var(--ink-soft); }

  /* a screenshot with frames, arrows and short labels over it */
  .shot { position: relative; width: 100%; aspect-ratio: 1280 / 820; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px -10px rgba(0, 0, 0, .35); background: #fff; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .shot svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .shot .frame { fill: color-mix(in srgb, var(--mark) 8%, transparent); stroke: var(--mark); stroke-width: 3; }
  .shot .frame.faded { stroke-opacity: .35; fill: none; }
  .shot .arrow { fill: none; stroke: var(--mark); stroke-width: 2.4; }
  .shot .arrow.faded { stroke-opacity: .3; }
  .shot .lbl { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border-radius: 999px;
    background: var(--label-bg); color: var(--label-ink); font-size: clamp(9px, 1.05vw, 13px); font-weight: 600; white-space: nowrap; box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .5); pointer-events: auto; cursor: default; }
  .shot .lbl b { display: grid; place-items: center; min-width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--mark); color: #fff; font-size: .9em; }
  .shot .lbl.faded { opacity: .45; }
  .frames { display: flex; gap: 6px; margin: 0 0 10px; }
  .frames button { padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12.5px; }
  .frames button.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
  .pts { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .pts li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 9px; padding: 8px 9px; border-radius: 11px; font-size: 13.5px; line-height: 1.45; cursor: default; }
  .pts li:hover, .pts li.on { background: var(--surface-2); }
  .pts li > b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--mark); color: #fff; font-size: 12px; }
  .pts li strong { display: block; font-size: 14px; }

  /* Variant B: a page in «Настройки» → «Обновление» */
  .sd { position: absolute; inset: 3% 4%; display: grid; grid-template-rows: auto minmax(0, 1fr); border-radius: 18px; background: var(--surface); box-shadow: var(--pop-shadow); overflow: hidden; }
  .sd-h { display: flex; align-items: center; padding: 12px 16px 12px 20px; border-bottom: 1px solid var(--line); }
  .sd-h h2 { margin: 0; font: 500 17px/1.2 var(--font-display); }
  .sd-h .x { margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 9px; background: none; color: var(--ink-soft); font-size: 18px; }
  .sd-body { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; }
  .sd-nav { padding: 12px 8px; border-right: 1px solid var(--line); background: var(--bg); display: grid; gap: 2px; align-content: start; font-size: 13.5px; }
  .sd-nav span { padding: 8px 11px; border-radius: 9px; color: var(--ink-soft); }
  .sd-nav span.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .sd-main { overflow: auto; padding: 18px 22px 30px; }
  .sd-main h3 { margin: 0 0 4px; font-size: 17px; }
  .upd-line { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 14px; margin-bottom: 18px; }
  .article { display: grid; gap: 22px; }
  .article .intro { margin: 0; color: var(--ink-soft); font-size: 14px; }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; }
  .toc a { padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); font-size: 12.5px; text-decoration: none; }
  .sec h4 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .sec h4 i { font-style: normal; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 13px; }
  .sec .row { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 14px; align-items: start; }
  @media (max-width: 1500px) { .sec .row { grid-template-columns: minmax(0, 1fr); } }
  .sec .pts li { padding: 4px 6px; }

  /* numbered marks of the mockup itself and the explanations on the right */
  .frames, .dots, .sec, .btn { position: relative; }
  .tour > .nb, .sd > .nb { top: 10px; right: 56px; }
  .banner > .nb { top: -9px; right: -9px; }
  .tour-pic > .nb { top: 6px; right: 6px; }
  .nb { position: absolute; top: -9px; right: -9px; z-index: 9; display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px;
    background: #2D6BC4; color: #fff; font: 700 12px/1 var(--font-body); box-shadow: 0 0 0 2px var(--bg); cursor: help; }
  .no-marks .nb { display: none; }
  .hl { animation: hl 1.6s ease-out; }
  @keyframes hl { 0%, 60% { box-shadow: 0 0 0 4px #2D6BC4; border-radius: 12px; } 100% { box-shadow: 0 0 0 4px transparent; } }
  .lg { position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow: auto; display: grid; gap: 10px; align-content: start; }
  .lg-top { padding: 16px 18px; border-radius: 16px; border: 1px dashed var(--ink-soft); background: var(--surface); font-size: 13.5px; color: var(--ink-soft); }
  .lg-top h2 { margin: 0 0 6px; font: 500 19px/1.2 var(--font-display); color: var(--ink); }
  .lg-top p { margin: 0 0 8px; }
  .lg-top label { display: flex; gap: 8px; color: var(--ink); cursor: pointer; }
  .lg-it { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; cursor: pointer; }
  .lg-it:hover, .lg-it.hl2 { border-color: #2D6BC4; }
  .lg-it > b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; background: #2D6BC4; color: #fff; font-size: 12px; }
  .lg-it h3 { margin: 0 0 3px; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .lg-it p { margin: 0; color: var(--ink-soft); }
  .lg-it p + p { margin-top: 5px; }
  .tg { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; }
  .tg-new { background: var(--ok-bg); color: var(--ok-ink); }
  .tg-ask { background: color-mix(in srgb, #2D6BC4 20%, var(--surface)); color: var(--ink); }
  .tg-part { background: color-mix(in srgb, #D9982A 24%, var(--surface)); color: var(--ink); }
</style>
</head>
<body>
<div class="pg">
  <div>
    <div class="switch" id="switch"></div>
    <div class="stage" id="stage"></div>
  </div>
  <aside class="lg" id="lg"></aside>
</div>

<script src="../src/guides/1.15.0/boxes.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in attrs || {}) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "text") el.textContent = v; else if (k === "html") el.innerHTML = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) { if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(function (x) { add(el, x); }); else el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  var SVG = "http://www.w3.org/2000/svg";
  function s(tag, attrs) { var el = document.createElementNS(SVG, tag); for (var k in attrs) el.setAttribute(k, attrs[k]); return el; }

  // Boxes of the buttons on each screenshot, measured by tools/guide-shots/run.js (in pixels of 1280 × 820).
  var BOX = window.GUIDE_BOXES["1.15.0"];

  // The guide of 1.15.0. A step has one or more frames (a button and what it opens); every frame has points:
  // a box on the screenshot, a short label put at `at` with a thin arrow to the box, and the longer text on the side.
  var GUIDE = { version: "1.15.0", title: "Транскрибация", steps: [
    { title: "Где найти", lead: "Новый раздел открывается тремя способами.", frames: [{ shot: "01-where", points: [
      { box: "icon", at: [110, 300], label: "Иконка раздела", text: "Звуковая волна в ряду иконок слева, между LLM и Генератором. Один клик — и раздел открыт." },
      { box: "menuItem", at: [1090, 560], label: "Меню «+»", text: "Кнопка «+» справа от вкладок открывает меню новой вкладки: там есть «Транскрибация»." },
      { box: "homeTile", at: [390, 600], label: "Плитка на «Главной»", text: "На «Главной» — плитка с тем, сколько расшифровок уже в истории." }] }] },
    { title: "Загрузите файл", lead: "Подойдёт видео или звук: mp4, mov, mkv, webm, mp3, m4a, wav, ogg, flac. До 2 ГБ, длина любая.", frames: [{ shot: "02-empty", points: [
      { box: "drop", at: [380, 500], label: "Перетащите сюда", text: "Перетащите файл из Проводника прямо на страницу — рамка подсветится." },
      { box: "pick", at: [760, 500], label: "Или выберите", text: "Или нажмите «Выбрать файл…» и найдите его на компьютере." },
      { box: "hist", at: [1110, 480], label: "История", text: "Справа — все прошлые расшифровки. Пока их нет, здесь пусто." }] }] },
    { title: "Запустите расшифровку", lead: "Ключ ChatGPT берётся из «Настроек», вводить его здесь не нужно.", frames: [{ shot: "03-file", points: [
      { box: "model", at: [480, 420], label: "Модель", text: "По умолчанию — самая точная по нашим проверкам. Менять не обязательно." },
      { box: "go", at: [880, 420], label: "Расшифровать", text: "Нажмите — и начнётся работа. Минута ролика стоит примерно треть цента." },
      { box: "remove", at: [1050, 150], label: "Другой файл", text: "«Убрать» — если выбрали не тот файл." }] }] },
    { title: "Пока идёт работа", lead: "Можно уйти в другой раздел — расшифровка продолжится.", frames: [{ shot: "04-busy", points: [
      { box: "bar", at: [620, 420], label: "Ход работы", text: "Полоса и надпись: сколько кусков речи нашлось и сколько уже готово." },
      { box: "dot", at: [760, 85], label: "Точка на вкладке", text: "Мигает, пока идёт работа, — видно из любого раздела." },
      { box: "stop", at: [330, 420], label: "Остановить", text: "Если передумали — расшифровка остановится, потрачены будут доли цента." }] }] },
    { title: "Смотрите с субтитрами", lead: "Сверху — ваш ролик с субтитрами прямо на кадре.", frames: [{ shot: "05-result", points: [
      { box: "sub", at: [1100, 560], label: "Субтитры", text: "Так субтитры встанут в монтаже — можно сразу проверить, вовремя ли." },
      { box: "strip", at: [1100, 620], label: "Фразы на полоске", text: "Каждый штрих — фраза. Клик по полоске перематывает ролик." },
      { box: "tabs", at: [400, 700], label: "Три вкладки", text: "«Текст», «Тайминги» и «Кратко» — дальше о каждой." }] }] },
    { title: "Текст и что с ним делать", lead: "Весь текст целиком. Его можно поправить прямо в поле.", frames: [{ shot: "06-text", points: [
      { box: "text", at: [1090, 430], label: "Можно править", text: "Исправьте слово, которое расслышалось неверно, — правка попадёт и в тайминги, и в субтитры." },

      { box: "prompt", at: [700, 790], label: "В промт", text: "Новый промт «Видео»: текст — расшифровка, комментарий — тайминги. Останется дописать, что сгенерировать." },

    { title: "Тайминги", lead: "Каждая фраза со временем начала и конца — время стоит на паузах голоса.", frames: [{ shot: "07-cues", points: [
      { box: "fmt", at: [1100, 430], label: "Как копировать", text: "Списком — как в монтажном листе, или «[0:12–0:15] текст» — так удобнее вставлять в промт." },
      { box: "copy", at: [1100, 490], label: "Копировать", text: "Копирует все тайминги в выбранном виде." },
      { box: "cue", at: [1100, 560], label: "Клик по фразе", text: "Перематывает ролик на эту фразу; та, что звучит, подсвечена." }] }] },
    { title: "Кратко", lead: "Пара предложений о главном — по кнопке, чтобы не платить, когда не нужно.", frames: [
      { name: "1. Нажмите", shot: "08-sum-empty", points: [
        { box: "make", at: [620, 660], label: "Сделать кратко", text: "Нажмите — через несколько секунд появится краткое содержание." }] },
      { name: "2. Что получится", shot: "09-sum", points: [
        { box: "brief", at: [1100, 400], label: "Кратко", text: "О чём ролик, в 2–4 предложениях." },
        { box: "points", at: [1100, 480], label: "Главные мысли", text: "Список по пунктам — удобно для описания ролика." },
        { box: "again", at: [620, 640], label: "Заново", text: "Если не понравилось — можно сделать ещё раз." }] }] },
    { title: "История и поиск", lead: "Все расшифровки остаются в истории.", frames: [{ shot: "10-search", points: [
      { box: "search", at: [760, 255], label: "Поиск", text: "Ищет и по названию файла, и по тексту внутри." },
      { box: "item", at: [760, 335], label: "Открыть", text: "Клик открывает расшифровку целиком." },
      { box: "del", at: [1110, 430], label: "Удалить", text: "Крестик удаляет; несколько секунд внизу видна кнопка «Отменить»." }] }] }
  ] };

  // Draws a screenshot with frames around the boxes, thin arrows from the labels and the labels themselves.
  // active: the number of the point to stress (the others get pale), or null.
  function shotEl(frame, active, startN) {
    var box = h("div", { class: "shot" }, h("img", { src: "../src/guides/1.15.0/" + frame.shot + ".webp", alt: "Снимок программы" }));
    var svg = s("svg", { viewBox: "0 0 1280 820", preserveAspectRatio: "none" });
    var defs = s("defs", {}), mk = s("marker", { id: "ah", viewBox: "0 0 10 10", refX: "8.5", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
    mk.append(s("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--mark)" }));
    defs.append(mk); svg.append(defs);
    frame.points.forEach(function (p, i) {
      var b = BOX[frame.shot][p.box], n = startN + i, dim = active != null && active !== n;
